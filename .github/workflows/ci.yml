name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: linux-build-${{ hashFiles('Package.resolved') }}
          restore-keys: linux-build-
      - run: swift build
      - run: swift test
      - run: swift run -c release ConvergenceHarness --seeds 2000
      - run: swift run -c release ConvergenceHarness --seeds 2000 --expiry deleteOps
      - run: swift run -c release ConvergenceHarness --seeds 2000 --revoke repushAll
      - run: swift run -c release ConvergenceHarness --seeds 2000 --blob-gc deadItemsOnly
      - run: swift run -c release ConvergenceHarness --seeds 2000 --revoke repushAll --blob-gc deadItemsOnly
      - run: swift run -c release ConvergenceHarness --seeds 2000 --peer logCursors
      - run: swift run -c release ConvergenceHarness --seeds 2000 --peer logCursors --revoke repushAll --blob-gc deadItemsOnly

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The official installer, same toolchain and per-user layout as local dev (winget's Swift.Toolchain).
      # compnerd/gha-setup-swift installed fine but then couldn't find swift on PATH (2026-10-01).
      - name: Install Swift 6.4.0
        shell: pwsh
        run: |
          $url = "https://download.swift.org/swift-6.4.0-release/windows10/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE-windows10.exe"
          $exe = Join-Path $env:RUNNER_TEMP "swift-installer.exe"
          Invoke-WebRequest $url -OutFile $exe
          # The bundle fetches some packages while it runs, and that sometimes fails on runners (2026-10-06: exit
          # 12006, a WinINet error, and once exit 0 with an empty Toolchains folder). Retry, and show the log.
          $swift = Join-Path $env:LOCALAPPDATA "Programs\Swift\Toolchains\*\usr\bin\swift.exe"
          foreach ($attempt in 1..3) {
            $log = Join-Path $env:RUNNER_TEMP "swift-install-$attempt.log"
            $p = Start-Process $exe -ArgumentList "-q", "-log", "`"$log`"" -Wait -PassThru
            if ($p.ExitCode -eq 0 -and (Test-Path $swift)) { break }
            Write-Host "Attempt $attempt failed (exit $($p.ExitCode), swift.exe present: $(Test-Path $swift)). Log tail:"
            Get-ChildItem $env:RUNNER_TEMP -Filter "swift-install-$attempt*.log" | ForEach-Object { Get-Content $_ -Tail 40 } | Out-Host
            if ($attempt -eq 3) { throw "Swift install failed 3 times" }
            Start-Sleep 20
          }
      # Mirrors scripts/swiftenv.sh: toolchain and runtime on PATH, SDKROOT set.
      - name: Put Swift on PATH
        shell: pwsh
        run: |
          $root = Join-Path $env:LOCALAPPDATA "Programs\Swift"
          $tc = Get-ChildItem "$root\Toolchains" -Directory | Select-Object -Last 1
          $rt = Get-ChildItem "$root\Runtimes" -Directory | Select-Object -Last 1
          $pf = Get-ChildItem "$root\Platforms" -Directory | Select-Object -Last 1
          if (-not ($tc -and $rt -and $pf)) { Get-ChildItem $root -Recurse -Depth 2 | Out-Host; throw "Swift layout not found under $root" }
          "$($tc.FullName)\usr\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "$($rt.FullName)\usr\bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "SDKROOT=$($pf.FullName)\Windows.platform\Developer\SDKs\Windows.sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - run: swift --version
      - uses: actions/cache@v4
        with:
          path: .build
          key: windows-build-${{ hashFiles('Package.resolved') }}
          restore-keys: windows-build-
      # swift-argument-parser is pinned below 1.8 in Package.swift: 1.8 ships symlinks Windows can't check out.
      - run: swift build
      # The M3 tray app (apps/Windows). `swift build` already builds it; this step names it in the log.
      - run: swift build --product ClipSyncWin
      - run: swift test

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .build
          key: macos-build-${{ hashFiles('Package.resolved') }}
          restore-keys: macos-build-
      - run: swift --version
      - run: swift build
      - run: swift test

  relay:
    runs-on: ubuntu-24.04
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y libsqlite3-dev
      - uses: actions/cache@v4
        with:
          path: Server/.build
          key: relay-build-${{ hashFiles('Package.resolved', 'Server/Package.resolved', 'Server/Package.swift') }}
          restore-keys: relay-build-
      - run: swift test
        working-directory: Server
