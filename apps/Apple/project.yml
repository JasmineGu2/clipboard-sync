# XcodeGen spec for the Apple apps. Generate with `xcodegen` in this folder; see README.md.
# The .xcodeproj is generated, not committed.
name: ClipSync

options:
  bundleIdPrefix: dev.jazz.clipsync
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    # XcodeGen fills ${CLIPSYNC_TEAM_ID} from the environment: `export CLIPSYNC_TEAM_ID=XXXXXXXXXX` before
    # running `xcodegen` (see README.md). Without it the Keychain access group has no team prefix.
    DEVELOPMENT_TEAM: ${CLIPSYNC_TEAM_ID}
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The shared package (ClipAppCore and below) is Swift 6 mode. The thin UI layer stays in Swift 5 mode
    # with complete checking, so concurrency issues show as warnings while it's first built on a Mac.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  ClipSync:
    path: ../..

targets:
  ClipSyncMac:
    type: application
    platform: macOS
    sources:
      - path: macOS
        excludes: ["*.plist", "*.entitlements"]
      - path: Shared
    dependencies:
      - package: ClipSync
        product: ClipAppCore
      # Shared/KeychainKeyStore.swift imports ClipCrypto directly, so link it explicitly.
      - package: ClipSync
        product: ClipCrypto
      # Shared/DevicesView.swift imports ClipSync directly (VaultDevice), so link it explicitly.
      - package: ClipSync
        product: ClipSync
      # Shared/PeerSockets.swift: direct device-to-device sync (F16).
      - package: ClipSync
        product: ClipPeerSocket
    settings:
      base:
        # The app is called ClipSync, but its Swift module can't be: the package has a `ClipSync` module.
        PRODUCT_NAME: ClipSync
        PRODUCT_MODULE_NAME: ClipSyncMac
        PRODUCT_BUNDLE_IDENTIFIER: dev.jazz.clipsync.mac
        INFOPLIST_FILE: macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: macOS/ClipSyncMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  ClipSynciOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes: ["*.plist", "*.entitlements"]
      - path: Shared
    dependencies:
      - package: ClipSync
        product: ClipAppCore
      # Shared/KeychainKeyStore.swift imports ClipCrypto directly, so link it explicitly.
      - package: ClipSync
        product: ClipCrypto
      # Shared/DevicesView.swift imports ClipSync directly (VaultDevice), so link it explicitly.
      - package: ClipSync
        product: ClipSync
      # Shared/PeerSockets.swift: direct device-to-device sync (F16).
      - package: ClipSync
        product: ClipPeerSocket
      - target: ClipShare
    settings:
      base:
        PRODUCT_NAME: ClipSync
        PRODUCT_MODULE_NAME: ClipSynciOS
        PRODUCT_BUNDLE_IDENTIFIER: dev.jazz.clipsync.ios
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/ClipSynciOS.entitlements
        TARGETED_DEVICE_FAMILY: "1"

  ClipShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes: ["*.plist", "*.entitlements"]
      # Only what the extension needs: the views and the App Intent stay in the app.
      - path: Shared/KeychainKeyStore.swift
      - path: Shared/AppPaths.swift
    dependencies:
      - package: ClipSync
        product: ClipAppCore
      # Shared/KeychainKeyStore.swift imports ClipCrypto directly, so link it explicitly.
      - package: ClipSync
        product: ClipCrypto
    settings:
      base:
        PRODUCT_NAME: ClipShare
        PRODUCT_MODULE_NAME: ClipShareExtension
        # An extension's bundle ID must start with its app's.
        PRODUCT_BUNDLE_IDENTIFIER: dev.jazz.clipsync.ios.share
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ClipShare.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES

